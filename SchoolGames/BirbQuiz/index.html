<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice Quarter 1 vocabulary by matching words to their definitions.">
  <meta name="theme-color" content="#f7f6f0">
  <title>Birbquiz · Quarter 1 | School Games</title>
  <link rel="icon" href="../../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="game.js" defer></script>
</head>
<body class="theme-vocabulary">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="../index.html"><img src="../../assets/mark.svg" width="38" height="38" alt="">School Games</a>
    <a class="back-link" href="../index.html"><span aria-hidden="true">←</span> All games</a>
  </header>
  <main class="game-main" id="main">
    <header class="game-heading"><p class="eyebrow">Vocabulary · Quarter 1</p><h1>Birbquiz word practice</h1><p class="subtitle">A new word is a new way to see the world.</p></header>
    <section class="panel quiz-panel" aria-label="Vocabulary quiz">
      <div class="vocabulary-prompt"><h2 class="question-label">Which word fits this definition?</h2><div id="def" aria-live="polite">Loading…</div></div>
      <div id="choices"><button id="b0" type="button" onclick="pick(0)">Loading…</button><button id="b1" type="button" onclick="pick(1)">Loading…</button><button id="b2" type="button" onclick="pick(2)">Loading…</button><button id="b3" type="button" onclick="pick(3)">Loading…</button></div>
      <div class="vocabulary-status" id="status" role="status" aria-live="polite"></div>
      <div class="stats vocabulary-stats" aria-label="Quiz statistics" aria-live="polite"><span id="count">Question: 0</span><span id="score">Correct: 0 | Wrong: 0</span><span id="streak">Streak: 0</span></div>
      <p class="review-words"><strong>Words to revisit:</strong> <span id="wrongList">None</span></p>
      <div class="quiz-actions"><button type="button" onclick="nextQ()">Next word <span aria-hidden="true">→</span></button><button class="secondary" type="button" onclick="resetAll()">Start over</button></div>
    </section>
  </main>
  <noscript><p class="notice">Please enable JavaScript in your browser to play this game.</p></noscript>
  <footer class="site-footer"><p>School Games</p><p>A little practice goes a long way.</p></footer>
</body>
</html>
